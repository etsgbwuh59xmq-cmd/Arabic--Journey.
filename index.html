<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فێربوونی زمانی عەرەبی</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <h1>فێربوونی زمانی عەرەبی 📚</h1>
        <p>کلیک لەسەر پیت یان وشەکان بکە بۆ گوێگرتن لە دەنگ و دیدەنی وەرگێڕانی کوردی!</p>
    </header>

    <main class="container">
        <!-- بەشی پیتەکان -->
        <section class="card">
            <h2>١. پیتەکانی زمانی عەرەبی</h2>
            <div class="letters-grid" id="lettersContainer"></div>
        </section>

        <!-- بەشی وشەکان و وەرگێڕانی کوردی -->
        <section class="card">
            <h2>٢. وشە گرنگەکان و وەرگێڕانی کوردی</h2>
            <div class="words-grid" id="wordsContainer"></div>
        </section>

        <!-- چوارگۆشەی پێشاندانی وەرگێڕان -->
        <div id="translationBox" class="translation-box">
            <p id="selectedWord">کلیک لەسەر وشەیەک یان پیتێک بکە...</p>
            <h3 id="kurdishMeaning">-</h3>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
